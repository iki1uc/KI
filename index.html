<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KI · ULTRA3‑RDY · AI‑KATALOG · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:30px; }
h1 { color:#0ff; text-shadow:0 0 12px #0ff; text-align:center; margin-bottom:30px; }

.block {
    background:#111;
    border-left:4px solid #0ff;
    padding:20px;
    margin-bottom:30px;
    border-radius:8px;
}

.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}

pre {
    background:#000;
    padding:15px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}

a {
    color:#0ff;
    font-size:18px;
    display:block;
    margin:6px 0;
    text-decoration:none;
}
a:hover { color:#9ef; }
</style>

<script type="module">

import { KI_PREFETCH } from "./KIuPREFETCH.js";
import { KI_LOAD_LOGIC } from "./Operator.js";
import { KI_GHOST } from "./BEAT.js";
import { KI_VERIFY } from "./FINALSCAN.js";
import { KI_ECO } from "./PRE9.math";

import META_H from "./UNC.room";
import META_6U from "./UNC6U.room";
import META_9U from "./UNC9.room";

let f = 0;

/* PANEL: KI‑SYSTEM */
function panelSystem(){
return `
KI · ULTRA3‑RDY · RESPO327
Systemstatus:
KI‑CORE aktiv
RESPO‑327 aktiv
ULTRA3‑Engine verbunden
GEO‑Engine aktiv
ROOM‑Engine aktiv
OPERATOR aktiv
SCAN aktiv
Frame: ${f}
`;
}

/* PANEL: ASCII‑GEO */
function panelGeo(){
const d = ["●","○","·","∙","•"];
const p = (i)=> d[(f+i)%d.length];
return `
ASCII‑GEO (frame ${f})
X ─── ${p(1)} ${p(2)} ${p(3)}
Y ─── ${p(2)} ${p(3)} ${p(4)}
Z ─── ${p(3)} ${p(4)} ${p(5)}
ROTATION: ${" ".repeat(f%12)}↻
`;
}

/* PANEL: WARP */
function panelWarp(){
return `
WARP‑TUNNEL
Depth: ${"●".repeat((f%6)+3)}
Warp : ${"~".repeat((f%10)+5)}
`;
}

/* PANEL: AI‑KATALOG */
function panelKatalog(){
return `
AI‑KATALOG
ORT  – Zielpunkt
HOME – Ruhepunkt
WORK – Arbeitspunkt
OHH  – Überlastpunkt
FREE – Freiraum
AI   – Respo‑Punkt
SOLL – Absichtspunkt

Operable Optionen:
→ To‑Do‑Matrix
→ Raum‑Navigation
→ KI‑Antwortpunkt
→ ULTRA3‑ASCII‑Panels
→ GEO‑Engine‑Mapping
→ ROOM‑Engine‑Routing
`;
}

/* MAIN LOOP */
setInterval(()=>{
    f++;

    document.getElementById("sys").textContent = panelSystem();
    document.getElementById("geo").textContent = panelGeo();
    document.getElementById("warp").textContent = panelWarp();
    document.getElementById("katalog").textContent = panelKatalog();

}, 150);

</script>

</head>

<body>

<h1>KI · ULTRA3‑RDY · AI‑KATALOG</h1>

<div class="block"><div class="title">KI‑SYSTEM</div><pre id="sys"></pre></div>
<div class="block"><div class="title">ASCII‑GEO</div><pre id="geo"></pre></div>
<div class="block"><div class="title">WARP‑TUNNEL</div><pre id="warp"></pre></div>
<div class="block"><div class="title">AI‑KATALOG</div><pre id="katalog"></pre></div>
