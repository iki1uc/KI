<body>

<h1>KI · Kern (0) · Intelligenz-Axiom</h1>
<p>NC‑LAGE‑SYSTEM · 3‑6‑9‑0‑3 Rotation · KI = 0 (Kern)</p>

<button onclick="RUN_KI()">KI START</button>

<pre id="out">KI wartet…</pre>

<script type="module">

/* ---------------------------------------------------------
   IMPORTS — alle neuen Dateien aus deinem KI‑Repository
--------------------------------------------------------- */

import { KI_PREFETCH } from "./KIuPREFETCH.js";
import { KI_LOAD_LOGIC } from "./Operator.js";
import { KI_GHOST } from "./BEAT.js";
import { KI_VERIFY } from "./FINALSCAN.js";
import { KI_ECO } from "./PRE9.math";
import { KI_AXIOM } from "./KERNEL.me";

/* ---------------------------------------------------------
   KI START — Hauptfunktion
--------------------------------------------------------- */

async function RUN_KI() {

    // 1) Prefetch: KI.tmp, BEN.tmp, NE.tmp, DA.tmp + UNC-Räume
    const pre = await KI_PREFETCH();

    // 2) Logic: Operatoren, NC.math, Score
    const logic = await KI_LOAD_LOGIC();

    // 3) Ghost-Layer: Kern-Ghost
    const ghost = KI_GHOST(pre);

    // 4) Verify-Layer: DA / NE / BEN Vergleich
    const verify = KI_VERIFY(
        pre.alt.tmpDA,
        pre.alt.tmpNE,
        pre.alt.tmpBEN
    );

    // 5) ECO: Kernwert (0-Achse)
    const eco = KI_ECO(pre, logic);

    // 6) Ausgabe
    const out = {
        axiome: KI_AXIOM,
        prefetch: pre,
        logic,
        ghost,
        verify,
        eco,
        state: "KI-READY"
    };

    document.getElementById("out").innerText =
        JSON.stringify(out, null, 2);
}

</script>
