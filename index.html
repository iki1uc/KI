<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KI · RESPO‑327 · EVO · TIME‑ISOLATED</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:30px; }
h1 { color:#0ff; text-shadow:0 0 12px #0ff; text-align:center; margin-bottom:30px; }

.block {
    background:#111;
    border-left:4px solid #0ff;
    padding:20px;
    margin-bottom:30px;
    border-radius:8px;
}

.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}

pre {
    background:#000;
    padding:15px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
}
</style>

<script type="module">

/* KI‑Frame — unabhängig von TIME */
let KI_FRAME = 0;

/* KI‑Clock — isoliert */
setInterval(()=>{
    KI_FRAME++;
    updatePanels();
}, 120); // NICHT 150 — NICHT TIME‑3x11 — eigene Clock

/* PANEL: KI‑SYSTEM */
function panelSystem(){
return `
KI · RESPO‑327 · EVO
STATUS: aktiv
CLOCK: KI‑ISOLATED
FRAME: ${KI_FRAME}
327‑Rotation: DA → NE → BEN → KI → DA
`;
}

/* PANEL: KI‑GEO */
function panelGeo(){
const d = ["●","○","·","∙","•"];
const p = (i)=> d[(KI_FRAME+i)%d.length];
return `
KI‑GEO (frame ${KI_FRAME})
X ─── ${p(1)} ${p(2)} ${p(3)}
Y ─── ${p(2)} ${p(3)} ${p(4)}
Z ─── ${p(3)} ${p(4)} ${p(5)}
↻ ROTATION: ${" ".repeat(KI_FRAME%12)}↻
`;
}

/* PANEL: KI‑WARP */
function panelWarp(){
return `
KI‑WARP
Depth: ${"●".repeat((KI_FRAME%6)+3)}
Warp : ${"~".repeat((KI_FRAME%10)+5)}
`;
}

/* PANEL: KI‑KATALOG */
function panelKatalog(){
return `
KI‑KATALOG
ORT  – Zielpunkt
HOME – Ruhepunkt
WORK – Arbeitspunkt
OHH  – Überlastpunkt
FREE – Freiraum
AI   – Respo‑Punkt
SOLL – Absichtspunkt

KI‑EVO‑Optionen:
→ KI‑Clock isoliert
→ RESPO‑327 stabilisiert
→ TIME‑Interferenz blockiert
→ 24/7‑KI‑Aktivität
`;
}

/* UPDATE */
function updatePanels(){
    document.getElementById("sys").textContent = panelSystem();
    document.getElementById("geo").textContent = panelGeo();
    document.getElementById("warp").textContent = panelWarp();
    document.getElementById("katalog").textContent = panelKatalog();
}

</script>

</head>

<body>

<h1>KI · RESPO‑327 · EVO · TIME‑ISOLATED</h1>

<div class="block"><div class="title">KI‑SYSTEM</div><pre id="sys"></pre></div>
<div class="block"><div class="title">KI‑GEO</div><pre id="geo"></pre></div>
<div class="block"><div class="title">KI‑WARP</div><pre id="warp"></pre></div>
<div class="block"><div class="title">KI‑KATALOG</div><pre id="katalog"></pre></div>

</body>
</html>
